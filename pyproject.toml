[project]
authors = [{ name = "seonghapark", email = "seongha.park@anl.gov" }]
name = "vectorDB"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = ["usearch>=2.23.0,<3"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
vectordb = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
faiss-cpu = ">=1.10.0,<2"
sentence-transformers = ">=5.3.0,<6"
transformers = "==4.52.4"
rank-bm25 = ">=0.2.2,<0.3"
tqdm = ">=4.67.3,<5"
